name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the apps typecheck against the compiled core package.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  database:
    name: Migrations and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway database that exists only for this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Applying $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Run isolation tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/isolation.sql
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The API integration tests import the compiled core package.
      - run: pnpm --filter @on-connect/core build
      - name: Run real PostgreSQL integration tests
        env:
          RUN_POSTGRES_INTEGRATION: "1"
        # Every file shares one database and alters the onconnect_app role,
        # so neither packages nor files may run in parallel.
        run: >-
          pnpm --filter @on-connect/core --filter @on-connect/api --filter @on-connect/sessions --filter @on-connect/worker --workspace-concurrency=1
          exec vitest run --no-file-parallelism --passWithNoTests integration.test.ts

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t on-connect-api:ci .
      - run: docker build --target worker -t on-connect-worker:ci .
      - run: docker build --target sessions -t on-connect-sessions:ci .
