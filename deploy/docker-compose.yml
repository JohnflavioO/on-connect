# Production stack for the VPS. Run from this directory:
#   docker compose --env-file .env up -d --build
#
# Only Caddy publishes ports. Docker bypasses UFW for published ports, so
# nothing else may ever get a `ports:` entry here.
name: on-connect

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-app: &app
  restart: unless-stopped
  logging: *logging
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET:?set ADMIN_PROXY_SECRET in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy

  # Super-admin panel. Sees every client (onconnect_system), so it is its own
  # process, never the public API. No port: only Caddy reaches it.
  admin:
    <<: *app
    build:
      context: ..
      target: admin
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:?set SYSTEM_DATABASE_URL in deploy/.env}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in deploy/.env}
      ADMIN_PROXY_SECRET: ${ADMIN_PROXY_SECRET:?set ADMIN_PROXY_SECRET in deploy/.env}
      ADMIN_ORIGIN: https://${API_DOMAIN}
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in deploy/.env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in deploy/.env}
    volumes:
      - ./supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    networks: [edge, data]
    stop_grace_period: 10s

  api:
    <<: *app
    build:
      context: ..
      target: api
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: "8080"
      PUBLIC_API_BASE_URL: https://${API_DOMAIN}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/.env}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in deploy/.env}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?set WEBHOOK_SECRET_KEY in deploy/.env}
      MEDIA_KEY: ${MEDIA_KEY:?set MEDIA_KEY in deploy/.env}
    volumes:
      # Supabase signs its database certificates with its own root CA, which
      # Node does not trust by default. DATABASE_URL points sslrootcert here
      # so the connection is verified instead of merely encrypted.
      - ./supabase-ca.crt:/run/certs/supabase-ca.crt:ro
      # Received media written by sessions; the API only reads and serves it.
      - media_data:/data/media:ro
    networks: [edge, data]
    stop_grace_period: 20s

  worker:
    <<: *app
    build:
      context: ..
      target: worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      REDIS_URL: redis://redis:6379
      # The worker delivers webhooks of every client, as onconnect_system.
      SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:?set SYSTEM_DATABASE_URL in deploy/.env}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?set WEBHOOK_SECRET_KEY in deploy/.env}
    volumes:
      - ./supabase-ca.crt:/run/certs/supabase-ca.crt:ro
    # `edge` gives the worker outbound internet access (Meta Graph API,
    # customer webhooks). It accepts no inbound connections. Webhook URLs
    # that resolve to private addresses are refused, so a client cannot use
    # the worker to reach Redis or other containers.
    networks: [edge, data]
    stop_grace_period: 35s

  # Owns the WhatsApp Web sockets. Exactly one replica: two processes on the
  # same session would replace each other's connection in a loop.
  sessions:
    <<: *app
    build:
      context: ..
      target: sessions
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      SYSTEM_DATABASE_URL: ${SYSTEM_DATABASE_URL:?set SYSTEM_DATABASE_URL in deploy/.env}
      SESSION_STATE_KEY: ${SESSION_STATE_KEY:?set SESSION_STATE_KEY in deploy/.env}
      SESSIONS_MAX: ${SESSIONS_MAX:-200}
      MEDIA_KEY: ${MEDIA_KEY:?set MEDIA_KEY in deploy/.env}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-90}
      # Media links handed to integrators point at the API.
      PUBLIC_API_BASE_URL: https://${API_DOMAIN}
    volumes:
      - ./supabase-ca.crt:/run/certs/supabase-ca.crt:ro
      - media_data:/data/media
    # `edge` for outbound WebSocket traffic to WhatsApp; no inbound ports.
    networks: [edge, data]
    stop_grace_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    # AOF so queued jobs survive a restart; noeviction because BullMQ must
    # never have keys evicted under memory pressure.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
  # No route to or from the internet: Redis is reachable only by api/worker.
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  # Encrypted received media (see packages/core/src/media.ts). Not backed up:
  # losing it only breaks old media links.
  media_data:
